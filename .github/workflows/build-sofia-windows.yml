name: Build SOFIA AI for Windows

on:
  workflow_dispatch:
  push:
    paths:
      - "SOFIA-AI/**"
      - ".github/workflows/build-sofia-windows.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: SOFIA-AI
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Set up Python for offline Ukrainian speech recognition
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Prepare offline Ukrainian Vosk model
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r voice/requirements.txt pyinstaller==6.19.0
          New-Item -ItemType Directory -Force -Path voice/model-extract | Out-Null
          Invoke-WebRequest -Uri "https://alphacephei.com/vosk/models/vosk-model-small-uk-v3-nano.zip" -OutFile "$env:TEMP/vosk-uk.zip"
          Expand-Archive -Path "$env:TEMP/vosk-uk.zip" -DestinationPath voice/model-extract -Force
          $model = Get-ChildItem voice/model-extract -Directory | Select-Object -First 1
          if (-not $model) { throw "Ukrainian Vosk model archive was empty." }
          Move-Item $model.FullName voice/model
          pyinstaller --noconfirm --clean --onedir --name sofia-listener --add-data "voice/model;model" voice/sofia_listener.py
      - name: Build Windows installer
        run: npm run dist
      - name: Verify installer output
        shell: pwsh
        run: |
          $installers = Get-ChildItem -Path dist -Filter *.exe -File
          if (-not $installers -or $installers.Count -eq 0) {
            throw "No Windows .exe installer was produced."
          }
          $installers | ForEach-Object { Write-Host "Built: $($_.FullName) ($($_.Length) bytes)" }
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: sofia-ai-windows-installer
          path: SOFIA-AI/dist/*.exe
          if-no-files-found: error
          retention-days: 14
