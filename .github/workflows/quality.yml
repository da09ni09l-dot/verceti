name: VERCETI quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: VERCETI-starter/verceti
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - name: Build Next.js application
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
          NEXT_PUBLIC_LIVEKIT_URL: wss://example.livekit.cloud
          LIVEKIT_API_KEY: ci-placeholder
          LIVEKIT_API_SECRET: ci-placeholder

# Keep quality checks active for the latest UI and navigation updates.

  build-sofia-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: SOFIA-AI
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install SOFIA AI dependencies
        run: npm install --no-audit --no-fund
      - name: Set up Python for offline Ukrainian speech recognition
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Prepare offline Ukrainian Vosk model
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r voice/requirements.txt pyinstaller==6.19.0
          New-Item -ItemType Directory -Force -Path voice/model-extract | Out-Null
          Invoke-WebRequest -Uri "https://alphacephei.com/vosk/models/vosk-model-small-uk-v3-nano.zip" -OutFile "$env:TEMP/vosk-uk.zip"
          Expand-Archive -Path "$env:TEMP/vosk-uk.zip" -DestinationPath voice/model-extract -Force
          $model = Get-ChildItem voice/model-extract -Directory | Select-Object -First 1
          if (-not $model) { throw "Ukrainian Vosk model archive was empty." }
          Move-Item $model.FullName voice/model
          pyinstaller --noconfirm --clean --onedir --name sofia-listener --distpath voice/dist --workpath voice/build --specpath voice --collect-all sounddevice --collect-all _sounddevice_data --collect-all vosk --add-data "voice/model;model" voice/sofia_listener.py
      - name: Build Windows installer
        run: npm run dist
      - name: Verify installer output
        shell: pwsh
        run: |
          $installers = Get-ChildItem -Path dist -Filter *.exe -File
          if (-not $installers -or $installers.Count -eq 0) {
            throw "No Windows .exe installer was produced."
          }
          $installers | ForEach-Object { Write-Host "Built: $($_.Name) ($($_.Length) bytes)" }
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: sofia-ai-windows-installer
          path: SOFIA-AI/dist/*.exe
          if-no-files-found: error
          retention-days: 14
