name: Build VERCETTI Windows Launcher

on:
  workflow_dispatch:
  push:
    branches:
      - "launcher/**"
    paths:
      - "VERCETI-starter/verceti/desktop-launcher/**"
      - ".github/workflows/build-windows-launcher.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: VERCETI-starter/verceti/desktop-launcher
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install launcher dependencies
        run: npm install
      - name: Build Windows installer
        run: npm run dist:win
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: VERCETTI-LAUNCHER-2026-Windows
          path: VERCETI-starter/verceti/desktop-launcher/release/*.exe
          if-no-files-found: error
          retention-days: 30
