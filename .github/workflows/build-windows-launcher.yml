name: Build VERCETTI Windows Launcher

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: VERCETI-starter/verceti
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_LIVEKIT_URL: ${{ secrets.NEXT_PUBLIC_LIVEKIT_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build standalone web app
        run: npm run build
      - name: Package Windows installer
        run: npx electron-builder --win nsis --x64
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: VERCETTI-LAUNCHER-2026-Windows
          path: VERCETI-starter/verceti/release/*.exe
          if-no-files-found: error
          retention-days: 30
