name: Build VERCETI Windows launcher

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "VERCETI-starter/verceti/desktop-launcher/**"
      - "VERCETI-starter/verceti/src/app/layout.tsx"
      - "VERCETI-starter/verceti/src/app/globals.css"
      - "VERCETI-starter/verceti/src/app/DownloadLauncherFooter.tsx"
      - ".github/workflows/build-verceti-desktop.yml"
  push:
    paths:
      - "VERCETI-starter/verceti/desktop-launcher/**"
      - "VERCETI-starter/verceti/src/app/layout.tsx"
      - "VERCETI-starter/verceti/src/app/globals.css"
      - "VERCETI-starter/verceti/src/app/DownloadLauncherFooter.tsx"
      - ".github/workflows/build-verceti-desktop.yml"
    branches:
      - main
      - "feat/verceti-windows-launcher"

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: VERCETI-starter/verceti/desktop-launcher
    env:
      CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
      CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read launcher version
        id: version
        shell: pwsh
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          "version=$($package.version)" >> $env:GITHUB_OUTPUT
      - name: Install dependencies
        run: npm install
      - name: Build Windows installer
        run: npm run dist:win
      - name: Check code-signing status
        id: signing
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path "release/VERCETI-Setup-*.exe" | Select-Object -First 1
          if (-not $installer) { throw "Installer not found." }
          $signature = Get-AuthenticodeSignature -FilePath $installer.FullName
          if (-not [string]::IsNullOrWhiteSpace($env:CSC_LINK)) {
            if ($signature.Status -ne "Valid" -or -not $signature.SignerCertificate) {
              throw "A signing certificate was supplied, but the installer signature is not valid: $($signature.Status)."
            }
            "status=signed" >> $env:GITHUB_OUTPUT
            Write-Host "Valid Authenticode signature: $($signature.SignerCertificate.Subject)"
          } else {
            "status=unsigned" >> $env:GITHUB_OUTPUT
            Write-Warning "No Windows signing certificate configured. The installer will be published unsigned; Windows SmartScreen may show an unknown-publisher warning."
          }
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: VERCETI-Windows-Installer
          path: VERCETI-starter/verceti/desktop-launcher/release/*.exe
          if-no-files-found: error
          retention-days: 14
      - name: Publish Windows installer as GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: main
          name: VERCETI для Windows v${{ steps.version.outputs.version }}
          body: |
            Інсталятор VERCETI для Windows 10/11 (x64).

            Статус цифрового підпису: ${{ steps.signing.outputs.status }}.
            ${{ steps.signing.outputs.status == 'unsigned' && 'Увага: файл не має цифрового підпису видавця. Windows може показати попередження SmartScreen. Завантажуйте інсталятор лише з офіційного релізу VERCETI.' || 'Файл має чинний підпис Authenticode.' }}

            SHA-256 можна перевірити після завантаження.
          files: VERCETI-starter/verceti/desktop-launcher/release/VERCETI-Setup-${{ steps.version.outputs.version }}.exe
          fail_on_unmatched_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
