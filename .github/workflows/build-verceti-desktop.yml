name: Build VERCETI Windows launcher

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "VERCETI-starter/verceti/desktop-launcher/**"
      - "VERCETI-starter/verceti/src/app/layout.tsx"
      - "VERCETI-starter/verceti/src/app/globals.css"
      - "VERCETI-starter/verceti/src/app/DownloadLauncherFooter.tsx"
  push:
    paths:
      - "VERCETI-starter/verceti/desktop-launcher/**"
      - "VERCETI-starter/verceti/src/app/layout.tsx"
      - "VERCETI-starter/verceti/src/app/globals.css"
      - "VERCETI-starter/verceti/src/app/DownloadLauncherFooter.tsx"
    branches:
      - main
      - "feat/verceti-windows-launcher"

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: VERCETI-starter/verceti/desktop-launcher
    env:
      CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
      CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require signing certificate for public release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CSC_LINK) -or [string]::IsNullOrWhiteSpace($env:CSC_KEY_PASSWORD)) {
            throw "A trusted Windows code-signing certificate is required. Configure WINDOWS_CERTIFICATE_BASE64 and WINDOWS_CERTIFICATE_PASSWORD in GitHub Actions secrets. Unsigned installers will not be published."
          }
      - name: Install dependencies
        run: npm install
      - name: Build Windows installer
        run: npm run dist:win
      - name: Verify Authenticode signature before public release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path "release/VERCETI-Setup-*.exe" | Select-Object -First 1
          if (-not $installer) { throw "Installer not found." }
          $signature = Get-AuthenticodeSignature -FilePath $installer.FullName
          if ($signature.Status -ne "Valid") {
            throw "Installer signature is not valid: $($signature.Status). Refusing to publish."
          }
          if (-not $signature.SignerCertificate) {
            throw "Installer has no signer certificate. Refusing to publish."
          }
          Write-Host "Valid Authenticode signature: $($signature.SignerCertificate.Subject)"
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: VERCETI-Windows-Installer
          path: VERCETI-starter/verceti/desktop-launcher/release/*.exe
          if-no-files-found: error
          retention-days: 14
      - name: Publish signed installer as GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1
          target_commitish: main
          name: VERCETI для Windows v1.0.1
          body: Інсталятор VERCETI для Windows 10/11 (x64). Файл перевірено на наявність чинного цифрового підпису Authenticode.
          files: VERCETI-starter/verceti/desktop-launcher/release/VERCETI-Setup-1.0.1.exe
          fail_on_unmatched_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
