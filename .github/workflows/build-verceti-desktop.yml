name: Build VERCETI Windows launcher

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "VERCETI-starter/verceti/desktop-launcher/**"
      - "VERCETI-starter/verceti/src/app/layout.tsx"
      - "VERCETI-starter/verceti/src/app/globals.css"
      - "VERCETI-starter/verceti/src/app/DownloadLauncherFooter.tsx"
  push:
    paths:
      - "VERCETI-starter/verceti/desktop-launcher/**"
      - "VERCETI-starter/verceti/src/app/layout.tsx"
      - "VERCETI-starter/verceti/src/app/globals.css"
      - "VERCETI-starter/verceti/src/app/DownloadLauncherFooter.tsx"
    branches:
      - main
      - "feat/verceti-windows-launcher"

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: VERCETI-starter/verceti/desktop-launcher
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build Windows installer
        run: npm run dist:win
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: VERCETI-Windows-Installer
          path: VERCETI-starter/verceti/desktop-launcher/release/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Publish installer as GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          target_commitish: main
          name: VERCETI для Windows v1.0.0
          body: Інсталятор VERCETI для Windows 10/11 (x64).
          files: VERCETI-starter/verceti/desktop-launcher/release/VERCETI-Setup-1.0.0.exe
          fail_on_unmatched_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
